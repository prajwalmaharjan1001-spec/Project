<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kathmandu Hotels | Hotel Booking</title>

    <link rel="stylesheet" href="index.css">

    <style>
        .wholePlaces {
            margin-left: 220px;
            margin-right: 100px;
            color: black;
            padding-top: 80px;
        }

        .wholePlaces a {
            color: black;
        }

        .listing {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .list {
            width: 70%;
            min-height: 200px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

            display: flex;
            gap: 20px;

            padding: 10px;

            text-decoration: none;
            color: black;

            background: white;
        }

        .list img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        .text1 {
            width: 60%;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rating {
            color: #f5b301;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .price {
            margin-top: 10px;
        }

        .book {
            align-self: flex-end;

            background-color: #65a765;
            color: white;

            border: 2px solid #555;
            border-radius: 10px;

            padding: 8px 15px;

            font-size: 16px;

            cursor: pointer;
        }

        .book:hover {
            background-color: #4d914d;
        }


        /* =========================
           BOOKING BOX
           ========================= */

        #blue-box {
            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 400px;
            max-width: 90%;

            max-height: 90vh;
            overflow-y: auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);

            z-index: 1000;
        }

        #close {
            position: absolute;

            right: 15px;
            top: 10px;

            border: none;
            background: none;

            font-size: 28px;

            cursor: pointer;
        }

        #booking-form {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        #booking-form input {
            padding: 10px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        #selected-hotel {
            font-weight: bold;

            margin-bottom: 15px;
        }

        .confirm-booking {
            margin-top: 10px;

            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #65a765;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .confirm-booking:hover {
            background: #4d914d;
        }
    </style>
</head>


<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <div class="navigation" id="home">

        <div class="nav-bar">

            <div style="display: flex;">

                <img
                    style="height: 70px;"
                    src="images/logo1.png"
                    alt="Hotel Booking Logo"
                >

                <h1 style="padding: 5px 0px; margin-top: 10px;">
                    HOTEL BOOKING
                </h1>

            </div>


            <div>

                <nav>

                    <a href="index.html">
                        Home
                    </a>

                    <a href="#">
                        Stays
                    </a>

                    <a href="priceDetails.html">
                        Pricing & Details
                    </a>

                </nav>

            </div>


            <div>

                <button>
                    Log in
                </button>

                <button>
                    Sign up
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         KATHMANDU HOTELS
    ========================== -->

    <div class="wholePlaces">

        <h2 style="margin-top: 20px;">
            Kathmandu's Deals
        </h2>

        <div class="listing">

            <!-- JavaScript will put Kathmandu hotels here -->

            <div id="kathmandu"></div>

        </div>

    </div>



    <!-- =========================
         BOOKING BOX
    ========================== -->

    <div id="blue-box">

        <button id="close" type="button">
            ×
        </button>


        <h2>
            Book Your Stay
        </h2>


        <p id="selected-hotel"></p>


        <form id="booking-form">


            <label for="guest-name">
                Full Name
            </label>

            <input
                type="text"
                id="guest-name"
                placeholder="Enter your name"
                required
            >


            <label for="guest-email">
                Email
            </label>

            <input
                type="email"
                id="guest-email"
                placeholder="Enter your email"
                required
            >


            <label for="guest-phone">
                Phone
            </label>

            <input
                type="tel"
                id="guest-phone"
                placeholder="Enter your phone number"
                required
            >


            <label for="check-in">
                Check-in
            </label>

            <input
                type="date"
                id="check-in"
                required
            >


            <label for="check-out">
                Check-out
            </label>

            <input
                type="date"
                id="check-out"
                required
            >


            <label for="guests">
                Number of Guests
            </label>

            <input
                type="number"
                id="guests"
                min="1"
                value="1"
                required
            >


            <button
                type="submit"
                class="confirm-booking"
            >
                Confirm Booking
            </button>

        </form>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


    <!-- Tell your existing showHotels()
         function to show Kathmandu -->
    <script>
        showHotels("Kathmandu");
    </script>


</body>

</html>
