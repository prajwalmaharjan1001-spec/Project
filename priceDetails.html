         <div id="blue-box">

    <button id="close" type="button">×</button>

    <h2>Book Your Stay</h2>

    <p id="selected-hotel"></p>

    <form id="booking-form">

        <label for="guest-name">Full Name</label>
        <input type="text" id="guest-name" placeholder="Enter your name" required>

        <label for="guest-email">Email</label>
        <input type="email" id="guest-email" placeholder="Enter your email" required>

        <label for="guest-phone">Phone</label>
        <input type="tel" id="guest-phone" placeholder="Enter your phone number" required>

        <label for="check-in">Check-in</label>
        <input type="date" id="check-in" required>

        <label for="check-out">Check-out</label>
        <input type="date" id="check-out" required>

        <label for="guests">Number of Guests</label>
        <input type="number" id="guests" min="1" value="1" required>

        <button type="submit" class="confirm-booking">
            Confirm Booking
        </button>

    </form>
